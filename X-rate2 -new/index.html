<!DOCTYPE html>
<html lang='hu'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
<title>Crypto Portfolio</title>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='manifest' href='manifest.json'>
<style>
  body { font-size: 14px; }
  .text-xs-mobile { font-size: 0.75rem; }
</style>
</head>
<body class='bg-gray-50 pb-24'>
<div class='max-w-5xl mx-auto p-3'>
<div class='flex justify-between items-center mb-4'>
  <h1 class='text-xl font-bold'>Portfolio</h1>
  <div id='last-updated' class='text-[10px] text-gray-500 text-right'></div>
</div>

<div class='grid grid-cols-3 gap-2 mb-4'>
<div class='bg-white p-2 shadow rounded border-l-4 border-blue-500'><div class='text-gray-500 text-[10px] uppercase'>Invested</div><div id='sum-invested' class='text-sm font-bold'>$0</div></div>
<div class='bg-white p-2 shadow rounded border-l-4 border-indigo-500'><div class='text-gray-500 text-[10px] uppercase'>Current</div><div id='sum-current' class='text-sm font-bold'>$0</div></div>
<div id='pl-card' class='bg-white p-2 shadow rounded border-l-4'><div class='text-gray-500 text-[10px] uppercase'>P/L Total</div><div id='sum-pl' class='text-sm font-bold'>$0</div></div>
</div>

<div id='table-container' class='bg-white rounded shadow overflow-x-auto'></div>
</div>

<div class='fixed bottom-0 left-0 right-0 p-3 bg-white/80 backdrop-blur-md border-t flex justify-center'>
<button id='refresh-btn' class='bg-blue-600 text-white px-10 py-3 rounded-full font-semibold shadow-lg active:scale-95 transition-transform'>Refresh Data</button>
</div>
<script src='app.js'></script>
</body>
</html>
